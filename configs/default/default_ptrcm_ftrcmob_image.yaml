method_name: "PT-RCM + FT-RCM-OB"
method_type: "PT-RCM + FT-RCM-OB"
base_method_name: "OBDECOC"
out_dir: output
best_hyperparams_dir: configs/results_hyperparams
seed: 0
num_workers: 4

dataset:
  dataset_name: "fgnet"
  dataset_type: "image"

pretrain:
  use_rankcl: true
  use_reweight: false
  model:
    model_params:
      feat_dims: [32, 16]
  rankcl:
    with_correct_penalty: true
    similarity_metric: "cosine"  # squaredL2

finetune:
  use_rankcl: true
  use_reweight: false
  model:
    model_params:
      feat_dims: [32, 16]
  rankcl:
    with_correct_penalty: true
    similarity_metric: "cosine"  # squaredL2


train:
  n_runs: 5
  epochs: 400
  batch_size: 128
  weight_decay: 0
  val_epoch: 1
  patience: 50
  best_metric_name: "QWK"
  val_ratio: 0.15